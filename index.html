<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 12 Probability — Year 11 Mathematics Advanced</title>
<style>
  :root {
    --ink: #1c2333;
    --muted: #5a6272;
    --paper: #f6f0e6;
    --card: #fffdf8;
    --line: #d9cfc0;
    --brick: #a33b32;
    --teal: #1e6b66;
    --gold: #c9a227;
    --rail: 300px;
    --toc: 208px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Calibri", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  .app {
    display: grid;
    grid-template-columns: var(--toc) 1fr var(--rail);
    grid-template-rows: auto auto 1fr auto;
    height: 100%;
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--ink); color: #f6f0e6;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header .meta { margin-left: auto; font-size: 12px; opacity: .85; }
  .progress { height: 4px; background: #3a4150; grid-column: 1 / -1; }
  .progress > span { display: block; height: 100%; background: var(--gold); width: 0; }
  aside.toc {
    background: #141820; color: #f3eadb; overflow: auto;
    padding: 10px 8px 24px; border-right: 1px solid #000;
  }
  aside.toc h3 {
    margin: 0 8px 10px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--gold);
  }
  aside.toc button {
    display: block; width: 100%; text-align: left; font: inherit;
    background: transparent; color: #e8dfcf; border: 0;
    border-radius: 8px; padding: 8px 10px; margin: 0 0 4px;
    cursor: pointer; line-height: 1.25;
  }
  aside.toc button:hover { background: #2a3142; }
  aside.toc button.on { background: var(--gold); color: #1c2333; font-weight: 700; }
  aside.toc button .code { display: block; font-weight: 800; font-size: 14px; }
  aside.toc button .sub { display: block; font-size: 12px; opacity: .85; }
  aside.toc button.on .sub { opacity: 1; }
  main { overflow: auto; padding: 18px 22px 36px; }
  .slide { display: none; max-width: 940px; }
  .slide.on { display: block; }
  .kicker {
    color: var(--brick); font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px;
  }
  h2 { font-size: 28px; line-height: 1.15; margin: 0 0 12px; }
  p, li { font-size: 20px; line-height: 1.45; }
  .small { font-size: 15px; color: var(--muted); }
  .cite {
    display: inline-block; background: #efe4c8; color: #5a4310;
    font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    margin: 0 0 10px;
  }
  .box {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin: 10px 0;
  }
  .say {
    background: #e7f3f1; border-left: 6px solid var(--teal);
    padding: 10px 14px; margin: 12px 0; font-size: 20px;
  }
  .warn {
    background: #fdece9; border-left: 6px solid var(--brick);
    padding: 10px 14px; margin: 12px 0;
  }
  button.reveal, button.nav { font: inherit; cursor: pointer; border-radius: 8px; }
  button.reveal {
    background: var(--teal); color: white; border: 0;
    padding: 10px 16px; font-size: 16px; font-weight: 700;
  }
  .working { display: none; margin-top: 12px; }
  .working.show { display: block; }
  .steps { margin: 0; padding-left: 22px; }
  .steps li { margin: 6px 0; }
  .ans { font-weight: 800; color: var(--teal); }
  .timechip {
    display: inline-block; background: var(--ink); color: #f6f0e6;
    font-size: 12px; padding: 3px 8px; border-radius: 99px; margin-right: 6px;
  }
  footer.bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-top: 1px solid var(--line); background: var(--card);
  }
  button.nav { background: var(--ink); color: #f6f0e6; border: 0; padding: 8px 14px; font-weight: 700; }
  button.nav:disabled { opacity: .35; cursor: not-allowed; }
  #counter { font-weight: 700; min-width: 90px; text-align: center; }
  .hint { font-size: 13px; color: var(--muted); margin-left: auto; }
  aside.rail {
    background: #1c2333; color: #f3eadb; overflow: auto;
    padding: 12px 12px 24px; border-left: 1px solid #000;
  }
  aside.rail h3 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold);
  }
  .fcard {
    background: #2a3142; border-radius: 8px; padding: 8px 10px;
    margin: 0 0 8px; font-size: 13.5px; line-height: 1.35; opacity: 0.72;
  }
  .fcard b { color: #fff; }
  .fcard .sym { font-size: 16px; color: var(--gold); font-weight: 800; }
  #formula-list [data-formula].formula-used {
    opacity: 1; outline: 3px solid #c9a227; background: #3d3420;
  }
  #formula-list [data-formula].formula-used::before {
    content: "Used on this page"; display: block; font-size: 11px;
    font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: #c9a227; margin-bottom: 4px;
  }
  svg.venn, svg.tree, svg.dots { max-width: 100%; width: 100%; height: auto; display: block; margin: 6px auto; }
  svg.tree, svg.dots { max-width: 640px; background: #fffdf8; border: 1px solid var(--line); border-radius: 8px; }
  .wplain p { margin: 8px 0; font-size: 18px; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 16px; }
  table.mini th, table.mini td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  table.mini th { background: #efe7d8; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sheetgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheetgrid .box { font-size: 16px; line-height: 1.4; }
  .sheetgrid .box .sym { font-weight: 800; }
  @media (max-width: 980px) { .sheetgrid { grid-template-columns: 1fr; } }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .qa {
    display: grid; grid-template-columns: 1fr minmax(260px, 380px);
    gap: 12px; align-items: start;
  }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr var(--rail); }
    aside.toc { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; max-height: none; padding: 8px; }
    aside.toc h3 { width: 100%; margin-bottom: 4px; }
    aside.toc button { width: auto; }
  }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr auto auto; }
    aside.rail { max-height: 36vh; }
    .two, .qa { grid-template-columns: 1fr; }
    header .meta { display: none; }
  }
  @media print {
    header, footer.bar, .progress, button.reveal { display: none !important; }
    .app { display: block; height: auto; }
    .slide { display: block !important; break-after: page; }
    .working { display: block !important; }
  }
</style>
</head>
<body>
<div class="app">
<header>
  <h1 id="hdr-title">Year 11 Mathematics Advanced · Chapter 12 Probability</h1>
  <div class="meta">NESA 2024 · Probability and data · 45 minutes per section</div>
</header>
<div class="progress"><span id="bar"></span></div>
<aside class="toc" id="toc">
  <h3>Choose a section</h3>
</aside>
<main id="deck"></main>
<aside class="rail" id="formula-list"></aside>
<footer class="bar">
  <button class="nav" id="prev" type="button">← Back</button>
  <span id="counter">1 / 1</span>
  <button class="nav" id="next" type="button">Next →</button>
  <span class="hint">Left panel picks a section · arrows change slides · F hides Formula List</span>
</footer>
</div>
<script>
let vennSeq = 0;
const pale = "#d7dde6";
const colL = "#7eb6e8";
const colR = "#f3b184";
const colBoth = "#e4c44a";
const colR3 = "#9ec96a";

function venn2(o = {}) {
  const u = "vn" + (++vennSeq);
  const L = o.left || "A";
  const R = o.right || "B";
  const mode = o.mode || "overlap";
  const shade = o.shade || "regions";
  const nL = o.nL, nR = o.nR, nBoth = o.nBoth, nOut = o.nOut;
  const tL = o.tL, tR = o.tR, tBoth = o.tBoth;

  let cxL = 128, cxR = 232, cy = 128, r = 68;
  if (mode === "disjoint") { cxL = 110; cxR = 250; r = 54; }
  const outline = `
    <circle cx="${cxL}" cy="${cy}" r="${r}" fill="none" stroke="#1c2333" stroke-width="2.5"/>
    <circle cx="${cxR}" cy="${cy}" r="${r}" fill="none" stroke="#1c2333" stroke-width="2.5"/>`;

  let bodies = "";
  if (mode === "overlap" || mode === "disjoint") {
    if (shade === "outside") {
      bodies = `
      <defs>
        <mask id="${u}-out">
          <rect x="10" y="36" width="340" height="184" fill="white"/>
          <circle cx="${cxL}" cy="${cy}" r="${r}" fill="black"/>
          <circle cx="${cxR}" cy="${cy}" r="${r}" fill="black"/>
        </mask>
      </defs>
      <rect x="10" y="36" width="340" height="184" fill="#f7f4ee"/>
      <rect x="10" y="36" width="340" height="184" fill="${colBoth}" mask="url(#${u}-out)"/>
      ${outline}`;
    } else {
    const showL = shade === "regions" || shade === "union" || shade === "onlyL";
    const showR = shade === "regions" || shade === "union" || shade === "onlyR";
    const showB = (mode === "overlap") && (shade === "regions" || shade === "union" || shade === "both");
    const fL = showL ? colL : pale;
    const fR = showR ? colR : pale;
    const fB = showB ? colBoth : pale;
    bodies = `
      <defs>
        <mask id="${u}-onlyL">
          <rect width="360" height="230" fill="black"/>
          <circle cx="${cxL}" cy="${cy}" r="${r}" fill="white"/>
          <circle cx="${cxR}" cy="${cy}" r="${r}" fill="black"/>
        </mask>
        <mask id="${u}-onlyR">
          <rect width="360" height="230" fill="black"/>
          <circle cx="${cxR}" cy="${cy}" r="${r}" fill="white"/>
          <circle cx="${cxL}" cy="${cy}" r="${r}" fill="black"/>
        </mask>
        <clipPath id="${u}-L"><circle cx="${cxL}" cy="${cy}" r="${r}"/></clipPath>
      </defs>
      <rect x="10" y="36" width="340" height="184" fill="#f7f4ee"/>
      <rect width="360" height="230" fill="${fL}" mask="url(#${u}-onlyL)"/>
      <rect width="360" height="230" fill="${fR}" mask="url(#${u}-onlyR)"/>
      ${mode === "overlap" ? `<g clip-path="url(#${u}-L)"><circle cx="${cxR}" cy="${cy}" r="${r}" fill="${fB}"/></g>` : ""}
      ${outline}`;
    }
  } else if (mode === "AinB") {
    bodies = `
      <rect x="10" y="36" width="340" height="184" fill="#f7f4ee"/>
      <circle cx="180" cy="128" r="82" fill="${colR}" stroke="#1c2333" stroke-width="2.5"/>
      <circle cx="168" cy="128" r="44" fill="${colL}" stroke="#1c2333" stroke-width="2.5"/>`;
  } else if (mode === "BinA") {
    bodies = `
      <rect x="10" y="36" width="340" height="184" fill="#f7f4ee"/>
      <circle cx="180" cy="128" r="82" fill="${colL}" stroke="#1c2333" stroke-width="2.5"/>
      <circle cx="192" cy="128" r="44" fill="${colR}" stroke="#1c2333" stroke-width="2.5"/>`;
  }

  const labY = 28;
  let labels = "";
  if (mode === "AinB") {
    labels = `<text x="156" y="134" text-anchor="middle" font-size="18" font-weight="800">${L}</text>
      <text x="248" y="78" text-anchor="middle" font-size="18" font-weight="800">${R}</text>`;
  } else if (mode === "BinA") {
    labels = `<text x="112" y="78" text-anchor="middle" font-size="18" font-weight="800">${L}</text>
      <text x="192" y="134" text-anchor="middle" font-size="18" font-weight="800">${R}</text>`;
  } else {
    labels = `<text x="${cxL - r + 8}" y="${labY}" font-size="18" font-weight="800">${L}</text>
      <text x="${cxR + r - 28}" y="${labY}" font-size="18" font-weight="800">${R}</text>`;
  }

  const nums = [];
  if (nL != null) nums.push(`<text x="${cxL - 28}" y="${cy + 6}" text-anchor="middle" font-size="20" font-weight="800">${nL}</text>`);
  if (nBoth != null && mode === "overlap") nums.push(`<text x="${(cxL+cxR)/2}" y="${cy + 6}" text-anchor="middle" font-size="20" font-weight="800">${nBoth}</text>`);
  if (nR != null) nums.push(`<text x="${cxR + 28}" y="${cy + 6}" text-anchor="middle" font-size="20" font-weight="800">${nR}</text>`);
  if (nOut != null) nums.push(`<text x="322" y="58" text-anchor="middle" font-size="18" font-weight="800">${nOut}</text>`);
  if (tL) nums.push(`<text x="${cxL - 30}" y="${cy + 6}" text-anchor="middle" font-size="13" font-weight="700">${tL}</text>`);
  if (tBoth && mode === "overlap") nums.push(`<text x="${(cxL+cxR)/2}" y="${cy + 6}" text-anchor="middle" font-size="13" font-weight="700">${tBoth}</text>`);
  if (tR) nums.push(`<text x="${cxR + 30}" y="${cy + 6}" text-anchor="middle" font-size="13" font-weight="700">${tR}</text>`);

  return `<svg class="venn" viewBox="0 0 360 230" role="img">
    <rect x="8" y="8" width="344" height="214" fill="none" stroke="#1c2333" stroke-width="2"/>
    <text x="16" y="26" font-size="15" font-weight="700">E</text>
    ${bodies}${labels}${nums.join("")}
  </svg>`;
}

function venn3(o = {}) {
  const u = "v3" + (++vennSeq);
  const P = {x:148, y:108, r:66}, Q = {x:214, y:108, r:66}, R = {x:181, y:162, r:66};
  const shade = o.shade || "pale";
  const n = o.n || {};
  return `<svg class="venn" viewBox="0 0 360 250" role="img">
    <defs>
      <clipPath id="${u}-p"><circle cx="${P.x}" cy="${P.y}" r="${P.r}"/></clipPath>
      <clipPath id="${u}-q"><circle cx="${Q.x}" cy="${Q.y}" r="${Q.r}"/></clipPath>
      <clipPath id="${u}-r"><circle cx="${R.x}" cy="${R.y}" r="${R.r}"/></clipPath>
    </defs>
    <rect x="8" y="8" width="344" height="234" fill="#f7f4ee" stroke="#1c2333" stroke-width="2"/>
    <text x="16" y="26" font-size="15" font-weight="700">E</text>
    <circle cx="${P.x}" cy="${P.y}" r="${P.r}" fill="${colL}" fill-opacity="0.38" stroke="#1c2333" stroke-width="2.5"/>
    <circle cx="${Q.x}" cy="${Q.y}" r="${Q.r}" fill="${colR}" fill-opacity="0.38" stroke="#1c2333" stroke-width="2.5"/>
    <circle cx="${R.x}" cy="${R.y}" r="${R.r}" fill="${colR3}" fill-opacity="0.38" stroke="#1c2333" stroke-width="2.5"/>
    ${shade === "center" ? `<g clip-path="url(#${u}-p)"><g clip-path="url(#${u}-q)">
      <circle cx="${R.x}" cy="${R.y}" r="${R.r}" fill="${colBoth}" fill-opacity="1"/>
    </g></g>` : ""}
    ${shade === "r-and" ? `<g clip-path="url(#${u}-r)">
      <circle cx="${P.x}" cy="${P.y}" r="${P.r}" fill="${colBoth}" fill-opacity="0.95"/>
      <circle cx="${Q.x}" cy="${Q.y}" r="${Q.r}" fill="${colBoth}" fill-opacity="0.95"/>
    </g>` : ""}
    ${shade === "except-center" ? `
      <defs>
        <mask id="${u}-ex">
          <rect x="8" y="8" width="344" height="234" fill="white"/>
          <g clip-path="url(#${u}-p)"><g clip-path="url(#${u}-q)">
            <circle cx="${R.x}" cy="${R.y}" r="${R.r}" fill="black"/>
          </g></g>
        </mask>
      </defs>
      <rect x="8" y="8" width="344" height="234" fill="${colBoth}" fill-opacity="0.82" mask="url(#${u}-ex)"/>
      <circle cx="${P.x}" cy="${P.y}" r="${P.r}" fill="none" stroke="#1c2333" stroke-width="2.5"/>
      <circle cx="${Q.x}" cy="${Q.y}" r="${Q.r}" fill="none" stroke="#1c2333" stroke-width="2.5"/>
      <circle cx="${R.x}" cy="${R.y}" r="${R.r}" fill="none" stroke="#1c2333" stroke-width="2.5"/>` : ""}
    <text x="88" y="64" font-size="18" font-weight="800">${o.p || "P"}</text>
    <text x="252" y="64" font-size="18" font-weight="800">${o.q || "Q"}</text>
    <text x="168" y="238" font-size="18" font-weight="800">${o.r || "R"}</text>
    ${n.p != null ? `<text x="112" y="100" text-anchor="middle" font-size="16" font-weight="800">${n.p}</text>` : ""}
    ${n.q != null ? `<text x="250" y="100" text-anchor="middle" font-size="16" font-weight="800">${n.q}</text>` : ""}
    ${n.r != null ? `<text x="181" y="208" text-anchor="middle" font-size="16" font-weight="800">${n.r}</text>` : ""}
    ${n.pq != null ? `<text x="181" y="92" text-anchor="middle" font-size="16" font-weight="800">${n.pq}</text>` : ""}
    ${n.pr != null ? `<text x="132" y="150" text-anchor="middle" font-size="16" font-weight="800">${n.pr}</text>` : ""}
    ${n.qr != null ? `<text x="230" y="150" text-anchor="middle" font-size="16" font-weight="800">${n.qr}</text>` : ""}
    ${n.all != null ? `<text x="181" y="132" text-anchor="middle" font-size="18" font-weight="800">${n.all}</text>` : ""}
    ${n.out != null ? `<text x="40" y="48" font-size="16" font-weight="800">${n.out}</text>` : ""}
  </svg>`;
}

function treeLine(x1, y1, x2, y2) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1c2333" stroke-width="2"/>`;
}
/** Neutral node; optional yellow highlight + GxRy tag (G = column, R = row). */
function treeNode(x, y, letter, opts = {}) {
  const r = opts.r || 14;
  const hi = !!opts.hi;
  const fill = hi ? "#f5e6a3" : "#e8e4dc";
  const stroke = hi ? "#8a7010" : "#1c2333";
  const gxry = opts.gxry || "";
  const brown = "#6b3a1f";
  const tag = gxry
    ? `<text x="${x - r - 3}" y="${y + 3}" text-anchor="end" font-size="8" font-weight="700" fill="${brown}">${gxry}</text>`
    : "";
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
    <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${opts.fs || 15}" font-weight="800">${letter}</text>
    ${tag}`;
}
function treeLabel(x, y, t, fs = 13) {
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#5a6272">${t}</text>`;
}
function treeOut(x, y, t, hi = false) {
  return `<text x="${x}" y="${y + 5}" text-anchor="start" font-size="15" font-weight="800" fill="${hi ? "#6b3a1f" : "#1c2333"}">${t}</text>`;
}

/**
 * Two fair coins. opts.labelGxRy, opts.hi = ["G2R1", ...]
 * Columns: G1 Start, G2 1st, G3 2nd; outcomes sit beside G3.
 */
function treeTwoCoins(opts = {}) {
  const lab = !!opts.labelGxRy;
  const hi = new Set(opts.hi || []);
  const is = (g) => hi.has(g);
  // Header band clear of nodes: first node at y≈48, headers at y=14
  const x0 = 70, x1 = 170, x2 = 300, x3 = 410;
  const yS = 130;
  const yH = 70, yT = 190;
  const yHH = 48, yHT = 100, yTH = 160, yTT = 212;
  return `<svg class="tree" viewBox="0 0 520 250" role="img" aria-label="Counting tree for two coin tosses">
    ${treeLabel(x0, 14, "Start")}${treeLabel(x1, 14, "1st")}${treeLabel(x2, 14, "2nd")}${treeLabel(x3 + 28, 14, "Outcome")}
    ${treeLine(x0, yS, x1, yH)}${treeLine(x0, yS, x1, yT)}
    ${treeLine(x1, yH, x2, yHH)}${treeLine(x1, yH, x2, yHT)}
    ${treeLine(x1, yT, x2, yTH)}${treeLine(x1, yT, x2, yTT)}
    ${treeLine(x2, yHH, x3 - 8, yHH)}${treeLine(x2, yHT, x3 - 8, yHT)}
    ${treeLine(x2, yTH, x3 - 8, yTH)}${treeLine(x2, yTT, x3 - 8, yTT)}
    ${treeNode(x0, yS, "·", { fs: 18, gxry: lab ? "G1R1" : "", hi: is("G1R1") })}
    ${treeNode(x1, yH, "H", { gxry: lab ? "G2R1" : "", hi: is("G2R1") })}
    ${treeNode(x1, yT, "T", { gxry: lab ? "G2R2" : "", hi: is("G2R2") })}
    ${treeNode(x2, yHH, "H", { gxry: lab ? "G3R1" : "", hi: is("G3R1") })}
    ${treeNode(x2, yHT, "T", { gxry: lab ? "G3R2" : "", hi: is("G3R2") })}
    ${treeNode(x2, yTH, "H", { gxry: lab ? "G3R3" : "", hi: is("G3R3") })}
    ${treeNode(x2, yTT, "T", { gxry: lab ? "G3R4" : "", hi: is("G3R4") })}
    ${treeOut(x3, yHH, "HH", is("G3R1"))}${treeOut(x3, yHT, "HT", is("G3R2"))}
    ${treeOut(x3, yTH, "TH", is("G3R3"))}${treeOut(x3, yTT, "TT", is("G3R4"))}
  </svg>`;
}

/** Coin then die — H/T then 1–6 (12 outcomes). */
function treeCoinDie() {
  const gap = 22, yH0 = 36, yT0 = 36 + 6 * gap;
  let body = "";
  for (let d = 1; d <= 6; d++) {
    const yH = yH0 + (d - 1) * gap, yT = yT0 + (d - 1) * gap;
    body += `${treeLine(100, 100, 180, yH)}${treeLine(100, 220, 180, yT)}
      ${treeOut(200, yH, "H" + d)}${treeOut(200, yT, "T" + d)}`;
  }

/**
 * Three fair coins. opts.labelGxRy, opts.hi = ["G4R1", ...]
 * G1 Start · G2 1st · G3 2nd · G4 3rd
 */
function treeThreeCoins(opts = {}) {
  const lab = !!opts.labelGxRy;
  const hi = new Set(opts.hi || []);
  const is = (g) => hi.has(g);
  const outs = ["HHH","HHT","HTH","HTT","THH","THT","TTH","TTT"];
  // More vertical room so G4 circles do not touch; headers clear of top node
  const gap = 36;
  const yOut = outs.map((_, i) => 52 + i * gap);
  const y3 = [52 + 0.5 * gap, 52 + 2.5 * gap, 52 + 4.5 * gap, 52 + 6.5 * gap];
  const y2H = (y3[0] + y3[1]) / 2, y2T = (y3[2] + y3[3]) / 2;
  const yS = (y2H + y2T) / 2;
  const x0 = 70, x1 = 150, x2 = 250, x3 = 360, x4 = 450;
  let edges = "";
  edges += treeLine(x0, yS, x1, y2H) + treeLine(x0, yS, x1, y2T);
  edges += treeLine(x1, y2H, x2, y3[0]) + treeLine(x1, y2H, x2, y3[1]);
  edges += treeLine(x1, y2T, x2, y3[2]) + treeLine(x1, y2T, x2, y3[3]);
  for (let i = 0; i < 4; i++) {
    edges += treeLine(x2, y3[i], x3, yOut[2 * i]) + treeLine(x2, y3[i], x3, yOut[2 * i + 1]);
  }
  const h = 52 + 7 * gap + 40;
  return `<svg class="tree" viewBox="0 0 580 ${h}" role="img" aria-label="Counting tree for three coin tosses">
    ${treeLabel(x0, 14, "Start")}${treeLabel(x1, 14, "1st")}${treeLabel(x2, 14, "2nd")}${treeLabel(x3, 14, "3rd")}${treeLabel(x4 + 20, 14, "Outcome")}
    ${edges}
    ${treeNode(x0, yS, "·", { fs: 18, gxry: lab ? "G1R1" : "", hi: is("G1R1") })}
    ${treeNode(x1, y2H, "H", { gxry: lab ? "G2R1" : "", hi: is("G2R1") })}
    ${treeNode(x1, y2T, "T", { gxry: lab ? "G2R2" : "", hi: is("G2R2") })}
    ${y3.map((y, i) => treeNode(x2, y, i % 2 === 0 ? "H" : "T", { gxry: lab ? `G3R${i + 1}` : "", hi: is(`G3R${i + 1}`) })).join("")}
    ${yOut.map((y, i) => treeNode(x3, y, i % 2 === 0 ? "H" : "T", { gxry: lab ? `G4R${i + 1}` : "", hi: is(`G4R${i + 1}`) }) + treeOut(x4, y, outs[i], is(`G4R${i + 1}`))).join("")}
  </svg>`;
}

/** Digits 2,5,7,8 without repetition — show first digit 2 fully, then ×4 pattern. */
function treeDigits2578() {
  const second = ["5","7","8"];
  const thirds = [["7","8"],["5","8"],["5","7"]];
  const outs = ["257","258","275","278","285","287"];
  let body = "", oi = 0;
  second.forEach((s, si) => {
    const y2 = 48 + si * 76 + 28;
    body += treeLine(120, 160, 200, y2) + treeNode(200, y2, s);
    thirds[si].forEach((t, ti) => {

  });

    ${treeLabel(40, 14, "Start")}${treeLabel(120, 14, "1st")}${treeLabel(200, 14, "2nd")}${treeLabel(280, 14, "3rd")}${treeLabel(360, 14, "Outcome")}
    ${treeLine(40, 160, 120, 160)}${treeNode(40, 160, "·", { fs: 18 })}${treeNode(120, 160, "2")}
    ${body}
    <text x="40" y="288" font-size="14" font-weight="700" fill="#5a6272">Same pattern for first digit 5, 7, and 8 → 4 × 6 = 24 outcomes.</text>
  </svg>`;
}

/**

function diceDotGraph(highlight) {
  const brown = "#6b3a1f";

    tags += `<text x="${x}" y="${y - 12}" text-anchor="middle" font-size="8" font-weight="700" fill="${brown}">e.g. G4R2</text>`;
  }

    : `<text x="12" y="14" font-size="8" font-weight="700" fill="${brown}">GxRy = green x, red y · yellow = favourable</text>`;

  for (let k = 1; k <= 6; k++) {
    axis.push(`<text x="${ox + (k - 1) * gap}" y="${oy + 22}" text-anchor="middle" font-size="12" font-weight="700">${k}</text>`);
    axis.push(`<text x="${ox - 22}" y="${oy - (k - 1) * gap + 4}" text-anchor="middle" font-size="12" font-weight="700">${k}</text>`);
  }
  return `<svg class="dots" viewBox="0 0 360 330" role="img" aria-label="Two-dice sample space graph">
    <line x1="${ox - 14}" y1="${oy}" x2="${ox + 5 * gap + 24}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox}" y1="${oy + 14}" x2="${ox}" y2="${oy - 5 * gap - 24}" stroke="#1c2333" stroke-width="2"/>
    <text x="${ox + 2.5 * gap}" y="318" text-anchor="middle" font-size="13" font-weight="800">Green die → (Gx)</text>
    <text x="18" y="155" text-anchor="middle" font-size="13" font-weight="800" transform="rotate(-90 18 155)">Red die ↑ (Ry)</text>
    ${legend}${axis.join("")}${dots}${tags}
  </svg>`;
}

function die6Dots(hi) {
  const set = new Set(hi || []);
  const cells = [1, 2, 3, 4, 5, 6].map((n) => {
    const x = 42 + (n - 1) * 54;
    const on = set.has(n);
    return `<circle cx="${x}" cy="40" r="${on ? 16 : 13}" fill="${on ? "#f5e6a3" : "#e8e4dc"}" stroke="#1c2333" stroke-width="2"/><text x="${x}" y="46" text-anchor="middle" font-size="18" font-weight="800">${n}</text>`;
  }).join("");
  return `<svg class="venn" viewBox="0 0 360 80" role="img" aria-label="Die sample space 1 to 6"><rect x="8" y="8" width="344" height="64" fill="#fffdf8" stroke="#1c2333" stroke-width="2"/>${cells}</svg>`;
}
function ints20(hi) {
  const set = new Set(hi || []);
  const cells = [];
  for (let n = 1; n <= 20; n++) {
    const col = (n - 1) % 10;
    const row = Math.floor((n - 1) / 10);
    const x = 26 + col * 33;
    const y = 24 + row * 34;
    const on = set.has(n);
    cells.push(`<circle cx="${x}" cy="${y}" r="${on ? 13 : 11}" fill="${on ? "#f5e6a3" : "#e8e4dc"}" stroke="#1c2333" stroke-width="2"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="800">${n}</text>`);
  }
  return `<svg class="venn" viewBox="0 0 360 72" role="img" aria-label="Integers 1 to 20"><rect x="6" y="4" width="348" height="64" fill="#fffdf8" stroke="#1c2333" stroke-width="2"/>${cells.join("")}</svg>`;
}

/** One highlighted product-rule path. steps: [{ n, p }] */
function treeE12Path(steps, pathLab) {
  const n = steps.length;
  const gap = n > 5 ? 70 : 118;
  const x0 = 48, y = 64;
  const xs = Array.from({ length: n + 1 }, (_, i) => x0 + i * gap);
  const ord = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"];
  let head = treeLabel(xs[0], 16, "Start");
  let lines = "", probs = "", nds = treeNode(xs[0], y, "·", { fs: 18 });
  for (let i = 0; i < n; i++) {
    head += treeLabel(xs[i + 1], 16, ord[i] || String(i + 1));
    lines += treeLine(xs[i], y, xs[i + 1], y);
    probs += treeE12P((xs[i] + xs[i + 1]) / 2, 52, steps[i].p);
    const long = String(steps[i].n || "").length > 2;
    nds += treeNode(xs[i + 1], y, steps[i].n, { hi: true, fs: long ? 11 : 15, r: long ? 16 : 14 });
  }
  const lab = pathLab || steps.map((s) => s.n).join(" then ");
  const W = xs[n] + 28 + Math.max(150, lab.length * 8);
  head += treeLabel(xs[n] + 80, 16, "Path");
  return `<svg class="tree" viewBox="0 0 ${W} 110" role="img" aria-label="Product-rule path: ${lab}">
    ${head}${lines}${probs}${nds}${treeOut(xs[n] + 22, y, lab, true)}
  </svg>`;
}

          <p>You cannot find P(both) from the given numbers. You would need another survey.</p>
          <p class="ans">Answer: invalid (not independent)</p>
        </div></div></div>
      <div class="box"><p><b>b</b> ‘The probability of a die showing a prime is 1/2, and the probability that it shows an odd number is 1/2. Hence the probability that it shows an odd prime number is 1/2 × 1/2 = 1/4.’</p>

        <div class="working" id="e11b"><div class="wplain">
          <p>A die: primes {2, 3, 5}, odds {1, 3, 5}. They overlap, and they are not independent.</p>
          <p>Among the three odds, two are prime. Among the three evens, only one is prime. So “odd” changes the chance of “prime”.</p>
          <p>Correct method: list the odd primes on the die. They are 3 and 5 only. That is 2 faces out of 6.</p>

const deck = document.getElementById("deck");
const toc = document.getElementById("toc");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let currentKey = "12A";
let i = 0;
let all = [];

function syncFormulas(slideEl) {
  if (!slideEl) return;
  const used = (slideEl.getAttribute("data-used-formulas") || "")
    .split(",").map((s) => s.trim()).filter(Boolean);
  document.querySelectorAll("#formula-list [data-formula]").forEach((card) => {
    card.classList.toggle("formula-used", used.includes(card.getAttribute("data-formula")));
  });
}
function go(n) {
  if (!all.length) return;
  i = Math.max(0, Math.min(all.length - 1, n));
  all.forEach((el, k) => el.classList.toggle("on", k === i));
  counter.textContent = (i + 1) + " / " + all.length;
  bar.style.width = ((i + 1) / all.length * 100) + "%";
  prev.disabled = i === 0;
  next.disabled = i === all.length - 1;
  syncFormulas(all[i]);
  document.querySelector("main").scrollTop = 0;
}
function loadLesson(key) {
  currentKey = key;
  if (location.hash.slice(1) !== key) location.hash = key;
  const meta = META[key];
  document.getElementById("hdr-title").textContent =
    "Year 11 Mathematics Advanced · " + meta.code + " " + meta.sub;
  document.getElementById("formula-list").innerHTML = FORMULAS[key];
  toc.querySelectorAll("button[data-key]").forEach((b) => {
    b.classList.toggle("on", b.dataset.key === key);
  });
  deck.innerHTML = "";
  (LESSONS[key] || []).forEach((s, idx) => {
    const el = document.createElement("section");
    el.className = "slide" + (idx === 0 ? " on" : "");
    el.setAttribute("data-used-formulas", s.used || "");
    el.innerHTML = `<p class="kicker">${s.kicker}</p><h2>${s.title}</h2>${s.html}`;
    deck.appendChild(el);
  });
  all = [...deck.querySelectorAll(".slide")];
  go(0);
}
ORDER.forEach((key) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.key = key;
  b.innerHTML = `<span class="code">${META[key].code}</span><span class="sub">${META[key].sub}</span>`;
  b.onclick = () => loadLesson(key);
  toc.appendChild(b);
});
prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(all.length - 1);
  if (e.key === "f" || e.key === "F") {
    const r = document.getElementById("formula-list");
    r.style.display = r.style.display === "none" ? "" : "none";
  }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.reveal");
  if (!b) return;
  const panel = document.getElementById(b.dataset.w);
  if (!panel) return;
  panel.classList.toggle("show");
  b.textContent = panel.classList.contains("show") ? "Hide working" : "Show working";
});
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (ORDER.includes(k) && k !== currentKey) loadLesson(k);
});
loadLesson((ORDER.includes((location.hash || "").slice(1)) ? location.hash.slice(1) : "12A"));
</script>
