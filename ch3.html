<script>
(function () {
  if (location.protocol !== "file:" && sessionStorage.getItem("y11adv-auth") !== "ok") {
    location.replace("index.html");
  }
  var so = document.getElementById("signout");
  if (so) so.addEventListener("click", function () {

  });

const LESSONS = {};
const ORDER = ["3A","3B","3C","3D","3E","3F","3G","3H","3I","REV"];
const META = {
  "3A": { code: "3A", sub: "Functions and function notation" },
  "3B": { code: "3B", sub: "Functions, relations, and graphs" },
  "3C": { code: "3C", sub: "Review of linear graphs" },
  "3D": { code: "3D", sub: "Quadratics — factoring" },
  "3E": { code: "3E", sub: "Completing the square" },
  "3F": { code: "3F", sub: "Quadratic formulae" },
  "3G": { code: "3G", sub: "Powers, cubics, and circles" },
  "3H": { code: "3H", sub: "Graphs with asymptotes" },
  "3I": { code: "3I", sub: "Direct and inverse variation" },
  "REV": { code: "Review", sub: "Chapter Review Exercise" }
};
function formulaShell(cards, note) {
  return `<h3>Formula List — keep this in view</h3>${cards}<p class="small" style="color:#c9b892">${note}</p>`;
}
const FORMULAS = {
  "3A": formulaShell(`
  <div class="fcard" data-formula="rule"><b>Function is a rule</b><br>y is a function of x when the rule gives exactly one y for each allowed x.<br><span class="sym">input x → output y</span></div>
  <div class="fcard" data-formula="fx"><b>Function notation</b><br><span class="sym">f(x) = …</span><br>Read “f of x”. Same idea as y = …</div>
  <div class="fcard" data-formula="substitute"><b>Substitute</b><br>To find f(a), replace every x by a and simplify.</div>
  <div class="fcard" data-formula="restrict"><b>Natural restriction</b><br>Cannot divide by 0. Cannot take the square root of a negative (in this course).</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3A, printed pp. 45–47."),
  "3B": formulaShell(`
  <div class="fcard" data-formula="vlt"><b>Vertical line test</b><br>If any vertical line meets the graph more than once, it is <b>not</b> a function.</div>
  <div class="fcard" data-formula="domain-range"><b>Domain and range</b><br>Domain = allowed x-values.<br>Range = y-values that actually occur.</div>
  <div class="fcard" data-formula="natural-domain"><b>Natural domain</b><br>All real x that keep the rule defined (no ÷0, no √negative).</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3B, printed pp. 53–55."),
  "3C": formulaShell(`
  <div class="fcard" data-formula="intercepts"><b>Intercepts</b><br>y-intercept: put x = 0.<br>x-intercept: put y = 0.<br>Plot both, then join with a ruler.</div>
  <div class="fcard" data-formula="origin-line"><b>Through the origin</b><br>If both intercepts are 0, use a second point (e.g. x = 1) to sketch.</div>
  <div class="fcard" data-formula="vert-horiz"><b>Horizontal / vertical</b><br>y = k is horizontal (a function).<br>x = k is vertical (not a function).</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3C, printed pp. 59–62."),
  "3D": formulaShell(`
  <div class="fcard" data-formula="concavity"><b>Concavity</b><br>If the x² coefficient is <b>+</b>, concave up ∪.<br>If <b>−</b>, concave down ∩.</div>
  <div class="fcard" data-formula="factor-zeroes"><b>Zeroes from factors</b><br>y = (x − α)(x − β) crosses at x = α and x = β.<br>y-intercept: put x = 0.</div>
  <div class="fcard" data-formula="axis-mid"><b>Axis from zeroes</b><br>Axis is midway: <span class="sym">x = (α + β) ÷ 2</span><br>Vertex: substitute that x back into y.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3D, printed pp. 65–69."),
  "3E": formulaShell(`
  <div class="fcard" data-formula="complete-sq"><b>Complete the square</b><br>x² + bx = (x + b/2)² − (b/2)².<br>Then add/subtract the constant term.</div>
  <div class="fcard" data-formula="vertex-form"><b>Vertex form</b><br><span class="sym">y = a(x − h)² + k</span><br>Axis x = h. Vertex (h, k). Concavity from a.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3E, printed pp. 73–76."),
  "3F": formulaShell(`
  <div class="fcard" data-formula="axis-formula"><b>Axis formula</b><br><span class="sym">x = −b ÷ (2a)</span><br>Then y of the vertex = f(that x).</div>
  <div class="fcard" data-formula="discriminant"><b>Discriminant</b><br><span class="sym">Δ = b² − 4ac</span><br>Δ &gt; 0 two x-intercepts; Δ = 0 one; Δ &lt; 0 none.</div>
  <div class="fcard" data-formula="quad-formula"><b>Quadratic formula</b><br><span class="sym">x = (−b ± √Δ) ÷ (2a)</span></div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3F, printed pp. 78–82."),
  "3G": formulaShell(`
  <div class="fcard" data-formula="circle"><b>Circle centre O</b><br><span class="sym">x² + y² = r²</span><br>Centre (0, 0), radius r. Domain −r ≤ x ≤ r.</div>
  <div class="fcard" data-formula="power"><b>y = xⁿ</b><br>Odd n: through (−1,−1), (0,0), (1,1); 180° symmetry.<br>Even n: through (−1,1), (0,0), (1,1); y-axis symmetry.</div>
  <div class="fcard" data-formula="sqrt"><b>y = √x</b><br>Domain x ≥ 0. Top half of a sideways parabola.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3G, printed pp. 84–87."),
  "3H": formulaShell(`
  <div class="fcard" data-formula="hyperbola"><b>Hyperbola</b><br><span class="sym">y = k / x</span> (k ≠ 0)<br>Asymptotes x = 0 and y = 0. Domain x ≠ 0.</div>
  <div class="fcard" data-formula="exponential"><b>Exponential</b><br><span class="sym">y = aˣ</span> (a &gt; 0, a ≠ 1)<br>Always through (0, 1). Range y &gt; 0.</div>
  <div class="fcard" data-formula="asymptote"><b>Asymptote</b><br>A line the graph approaches but does not cross.<br>Hyperbola: both axes. Exponential: the x-axis (y = 0).</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3H, printed pp. 88–92."),
  "3I": formulaShell(`
  <div class="fcard" data-formula="direct"><b>Direct variation</b><br><span class="sym">y = kx</span><br>Double x → double y. Graph is a line through O.</div>
  <div class="fcard" data-formula="inverse"><b>Inverse variation</b><br><span class="sym">y = k / x</span><br>Double x → y is halved. Graph is a hyperbola.</div>
  <div class="fcard" data-formula="inverse-sq"><b>Inverse square</b><br><span class="sym">y = k / x²</span><br>Double x → y is divided by 4.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 3I, printed pp. 94–97."),
  "REV": formulaShell(`
  <div class="fcard" data-formula="fx"><b>f(x)</b><br>Substitute the given number or expression.</div>
  <div class="fcard" data-formula="vlt"><b>Vertical line test</b><br>Two y-values for one x → not a function.</div>
  <div class="fcard" data-formula="vertex-form"><b>Vertex / axis</b><br>From factors, completed square, or x = −b/(2a).</div>
  <div class="fcard" data-formula="discriminant"><b>Δ = b² − 4ac</b><br>Tells how many x-intercepts.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Chapter Review Exercise, printed pp. 98–101.")
};
let slides = [];
function pack(key) {
  LESSONS[key] = slides;
  slides = [];
}
function leftover(dev, chal, extra) {
  return `
    <div class="cite">Independent work — question numbers only</div>
    <p>Do these from the book. Do not copy extra question text here.</p>
    <div class="box"><b>Development:</b> ${dev}</div>
    <div class="box"><b>Challenge:</b> ${chal}</div>
    ${extra || ""}
    <div class="say">If you get stuck, the gold Formula List card is the method for that type.</div>`;
}
function leftoverF(found) {
  return `
    <div class="cite">Independent work — question numbers only</div>
    <p>In class we modelled Development and Challenge. Do the leftover Foundation from the book.</p>
    <div class="box"><b>Foundation:</b> ${found}</div>
    <div class="say">Use the gold Formula List card. Sketch on graph paper; mark intercepts and the vertex.</div>`;
}

function xy(x, y, o) {
  const ox = o.ox, oy = o.oy, s = o.s;
  return { X: ox + x * s, Y: oy - y * s };
}
function axes(o) {
  o = Object.assign({ w: 360, h: 280, ox: 180, oy: 150, s: 28, xmin: -6, xmax: 6, ymin: -5, ymax: 5 }, o || {});
  const { w, h, ox, oy, s, xmin, xmax, ymin, ymax } = o;
  let g = `<svg class="graph" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-label="${o.aria || "coordinate graph"}">`;
  g += `<rect width="${w}" height="${h}" fill="#fffdf8"/>`;
  for (let x = xmin; x <= xmax; x++) {
    const X = ox + x * s;
    g += `<line x1="${X}" y1="${oy - ymax * s}" x2="${X}" y2="${oy - ymin * s}" stroke="#eee6d6" stroke-width="1"/>`;
  }
  for (let y = ymin; y <= ymax; y++) {
    const Y = oy - y * s;
    g += `<line x1="${ox + xmin * s}" y1="${Y}" x2="${ox + xmax * s}" y2="${Y}" stroke="#eee6d6" stroke-width="1"/>`;
  }
  g += `<line x1="${ox + xmin * s}" y1="${oy}" x2="${ox + xmax * s}" y2="${oy}" stroke="#1c2333" stroke-width="1.6"/>`;
  g += `<line x1="${ox}" y1="${oy - ymin * s}" x2="${ox}" y2="${oy - ymax * s}" stroke="#1c2333" stroke-width="1.6"/>`;
  g += `<text x="${ox + xmax * s - 8}" y="${oy + 16}" font-size="16" fill="#1c2333">x</text>`;
  g += `<text x="${ox + 6}" y="${oy - ymax * s + 16}" font-size="16" fill="#1c2333">y</text>`;
  return { g, o, close: () => "</svg>" };
}
function dot(ax, x, y, label) {
  const p = xy(x, y, ax.o);
  let s = `<circle cx="${p.X}" cy="${p.Y}" r="3.5" fill="#a33b32"/>`;

function three(a, b, c) {

}
function tbl(cols, rows) {

}
function vdash(ax, x) {

}
function hdash(ax, y) {

  return `<line x1="${ax.o.ox + ax.o.xmin * ax.o.s}" y1="${Y}" x2="${ax.o.ox + ax.o.xmax * ax.o.s}" y2="${Y}" stroke="#a33b32" stroke-width="2" stroke-dasharray="5 4"/>`;

function pathFn(ax, fn, color) {
  let d = "";
  for (let i = 0; i <= 80; i++) {
    const x = ax.o.xmin + (ax.o.xmax - ax.o.xmin) * i / 80;
    const y = fn(x);

    const p = xy(x, y, ax.o);

}
function pathSide(ax, a) {
  let d = "";
  for (let i = 0; i <= 60; i++) {

    const x = a * y * y;
    const p = xy(x, y, ax.o);
    d += (d ? " L " : "M ") + p.X + " " + p.Y;

function seg(ax, x1, y1, x2, y2, color) {
  const a = xy(x1, y1, ax.o), b = xy(x2, y2, ax.o);

function ellipseG(ax, rx, ry) {
  const c = xy(0, 0, ax.o);

function miniAx(extra) {
  return axes(Object.assign({ w: 176, h: 146, ox: 88, oy: 76, s: 16, xmin: -4, xmax: 4, ymin: -3.5, ymax: 3.5, aria: "relation graph" }, extra || {}));

function relDraw(kind, showV) {
  const ax = miniAx();

  if (kind === "cubic") { body = pathFn(ax, (x) => 0.12 * x * x * x); vx = 1; }
  else if (kind === "circle") { body = ellipseG(ax, 2.4, 2.4); vx = 1.2; }
  else if (kind === "line") { body = seg(ax, -3.5, -2, 3.5, 2.6); vx = 1; }
  else if (kind === "ellipse") { body = ellipseG(ax, 3, 2); vx = 1.5; }
  else if (kind === "side") { body = pathSide(ax, 0.35); vx = 1.2; }
  else if (kind === "parab") { body = pathFn(ax, (x) => 0.28 * x * x - 2); vx = 1; }

/* 3G / 3H / 3I / REV — finals from ch3_answers_only.txt (CMS6 printed 520–525) */

function mini(headers, rows) {
  const th = headers.map((h) => `<th>${h}</th>`).join("");
  const tr = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<table class="mini"><tr>${th}</tr>${tr}</table>`;
}
function curveGraph(fn, opts) {
  const ax = axes(opts);
  let d = "";
  let pen = false;
  for (let i = 0; i <= 140; i++) {
    const x = ax.o.xmin + (ax.o.xmax - ax.o.xmin) * i / 140;
    const y = fn(x);
    if (!isFinite(y) || y < ax.o.ymin - 2 || y > ax.o.ymax + 2) { pen = false; continue; }
    const p = xy(x, y, ax.o);
    d += (pen ? " L " : "M ") + p.X + " " + p.Y;
    pen = true;
  }
  let extra = "";
  if (opts && opts.pts) extra = opts.pts.map((p) => dot(ax, p[0], p[1], p[2])).join("");
  return ax.g + `<path d="${d}" fill="none" stroke="#1e6b66" stroke-width="2.2"/>` + extra + ax.close();
}
function circMarks(r, opts) {
  const ax = axes(Object.assign({ s: 36, xmin: -r - 1, xmax: r + 1, ymin: -r - 1, ymax: r + 1 }, opts || {}));
  const c = xy(0, 0, ax.o);
  const marks = (opts && opts.pts ? opts.pts : [[r, 0, ""], [-r, 0, ""], [0, r, ""], [0, -r, ""]])
    .map((p) => dot(ax, p[0], p[1], p[2])).join("");
  return ax.g + `<circle cx="${c.X}" cy="${c.Y}" r="${r * ax.o.s}" fill="none" stroke="#1e6b66" stroke-width="2.2"/>` + marks + ax.close();
}
function semiGraph(r, part, opts) {
  const pad = Math.max(r + 1.2, 2.5);
  const ax = axes(Object.assign({ s: 40, xmin: -pad, xmax: pad, ymin: -pad, ymax: pad }, opts || {}));
  const c = xy(0, 0, ax.o);
  const R = r * ax.o.s;
  let d = "";
  if (part === "upper") d = `M ${c.X - R} ${c.Y} A ${R} ${R} 0 0 1 ${c.X + R} ${c.Y}`;
  if (part === "lower") d = `M ${c.X - R} ${c.Y} A ${R} ${R} 0 0 0 ${c.X + R} ${c.Y}`;
  if (part === "right") d = `M ${c.X} ${c.Y - R} A ${R} ${R} 0 0 1 ${c.X} ${c.Y + R}`;
  if (part === "left") d = `M ${c.X} ${c.Y + R} A ${R} ${R} 0 0 1 ${c.X} ${c.Y - R}`;
  let extra = "";
  if (opts && opts.pts) extra = opts.pts.map((p) => dot(ax, p[0], p[1], p[2])).join("");
  return ax.g + `<path d="${d}" fill="none" stroke="#1e6b66" stroke-width="2.2"/>` + extra + ax.close();
}

const deck = document.getElementById("deck");
const toc = document.getElementById("toc");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let currentKey = "3A";
let i = 0;
let all = [];

function syncFormulas(slideEl) {
  if (!slideEl) return;
  const used = (slideEl.getAttribute("data-used-formulas") || "")
    .split(",").map((s) => s.trim()).filter(Boolean);
  document.querySelectorAll("#formula-list [data-formula]").forEach((card) => {
    card.classList.toggle("formula-used", used.includes(card.getAttribute("data-formula")));
  });
}
function go(n) {
  if (!all.length) return;
  i = Math.max(0, Math.min(all.length - 1, n));
  all.forEach((el, k) => el.classList.toggle("on", k === i));
  counter.textContent = (i + 1) + " / " + all.length;
  bar.style.width = ((i + 1) / all.length * 100) + "%";
  prev.disabled = i === 0;
  next.disabled = i === all.length - 1;
  syncFormulas(all[i]);
  document.querySelector("main").scrollTop = 0;
}
function loadLesson(key) {
  currentKey = key;
  if (location.hash.slice(1) !== key) location.hash = key;
  const meta = META[key];
  document.getElementById("hdr-title").textContent =
    "Year 11 Mathematics Advanced · " + meta.code + " " + meta.sub;
  document.getElementById("formula-list").innerHTML = FORMULAS[key];
  toc.querySelectorAll("button[data-key]").forEach((b) => {
    b.classList.toggle("on", b.dataset.key === key);
  });
  deck.innerHTML = "";
  (LESSONS[key] || []).forEach((s, idx) => {
    const el = document.createElement("section");
    el.className = "slide" + (idx === 0 ? " on" : "");
    el.setAttribute("data-used-formulas", s.used || "");
    el.innerHTML = `<p class="kicker">${s.kicker}</p><h2>${s.title}</h2>${s.html}`;
    deck.appendChild(el);
  });
  all = [...deck.querySelectorAll(".slide")];
  go(0);
}
ORDER.forEach((key) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.key = key;
  b.innerHTML = `<span class="code">${META[key].code}</span><span class="sub">${META[key].sub}</span>`;
  b.onclick = () => loadLesson(key);
  toc.appendChild(b);
});
prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(all.length - 1);
  if (e.key === "f" || e.key === "F") {
    const r = document.getElementById("formula-list");
    r.style.display = r.style.display === "none" ? "" : "none";
  }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.reveal");
  if (!b) return;
  const panel = document.getElementById(b.dataset.w);
  if (!panel) return;
  panel.classList.toggle("show");
  b.textContent = panel.classList.contains("show") ? "Hide working" : "Show working";
});
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (ORDER.includes(k) && k !== currentKey) loadLesson(k);
});
loadLesson((ORDER.includes((location.hash || "").slice(1)) ? location.hash.slice(1) : "3A"));

</script>
</body>
