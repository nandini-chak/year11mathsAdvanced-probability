<script>
const LESSONS = {};
const ORDER = ["13A","13B","13C","REV"];
const META = {
  "13A": { code: "13A", sub: "Random variables and frequency tables" },
  "13B": { code: "13B", sub: "Cumulative frequency" },
  "13C": { code: "13C", sub: "Grouped data" },
  "REV": { code: "Review", sub: "Chapter Review Exercise" }
};
function formulaShell(cards, note) {
  return `<h3>Formula List — keep this in view</h3>${cards}<p class="small" style="color:#c9b892;font-size:11px;line-height:1.35">${note}</p>`;
}
const FORMULAS = {
  "13A": formulaShell(`
  <div class="fcard" data-formula="rv"><b>Random variable X</b><br>Upper-case letter for the numeric or categorical outcome of a random experiment.<br><span class="sym">x</span> = one possible value.</div>
  <div class="fcard" data-formula="freq"><b>Frequency f</b><br><span class="sym">f =</span> how many times a value appears in the dataset.</div>
  <div class="fcard" data-formula="relfreq"><b>Relative frequency rf</b><br><span class="sym">rf = f ÷ total</span><br>Estimates probability when the experiment is repeated many times.</div>
  <div class="fcard" data-formula="histogram"><b>Histogram</b><br>Bars <b>touch</b> and are <b>centred</b> on each score. Used for discrete numeric data.</div>
  <div class="fcard" data-formula="polygon"><b>Frequency polygon</b><br>Join the <b>centres</b> of neighbouring bars; return to the horizontal axis at each end.</div>
  <div class="fcard" data-formula="discrete"><b>Discrete</b><br>Numeric values that can be <b>listed</b> (e.g. 0, 1, 2, 3 heads).</div>
  <div class="fcard" data-formula="categorical"><b>Categorical</b><br>Values are <b>names or labels</b> (e.g. bus, train, walk).</div>
  <div class="fcard" data-formula="continuous"><b>Continuous</b><br>Values lie in an <b>interval</b> on the number line (e.g. height, speed).</div>
  <div class="fcard" data-formula="mode"><b>Mode</b><br>The value with the <b>highest frequency</b> (most common outcome).</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 13A, printed pp. 479–483."),
  "13B": formulaShell(`
  <div class="fcard" data-formula="median"><b>Median</b><br>Odd <i>n</i>: middle score.<br>Even <i>n</i>: mean of the two middle scores.<br>From cf: the score where the halfway count sits.</div>
  <div class="fcard" data-formula="cf"><b>cf</b><br>Cumulative frequency of <i>x</i> = number of scores with <i>X ≤ x</i>.<br>Build by adding <i>f</i> from left to right.</div>
  <div class="fcard" data-formula="crf"><b>crf</b><br>Cumulative relative frequency.<br>Each entry = (cf ÷ total). Last crf = 1.</div>
  <div class="fcard" data-formula="ogive"><b>Ogive</b><br>Cumulative frequency polygon.<br>Read median: horizontal line at halfway (cf = <i>n</i>/2 or crf = 0.5).</div>
  <div class="fcard" data-formula="hist-polygon-rules"><b>Drawing rules (Box 5)</b><br><b>Frequency polygon:</b> join <b>centres</b> of column tops.<br><b>Cumulative polygon:</b> join <b>top-right corners</b>; extend left to bottom-left of first column.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 13B, printed pp. 492–496."),
  "13C": formulaShell(`
  <div class="fcard" data-formula="grouping"><b>Grouping</b><br>Equal-width bins (intervals). Tally each score into one row.<br><span class="sym">cf</span> and <span class="sym">crf</span> work the same as in 13B.</div>
  <div class="fcard" data-formula="class-centre"><b>Class centre</b><br>Midpoint of the interval:<br><span class="sym">centre = (lower + upper) ÷ 2</span></div>
  <div class="fcard" data-formula="boundary-lower"><b>Boundary rule (theory)</b><br>Data on a boundary goes in the <b>lower</b> interval.<br><span class="sym">X ≤ x</span> for cumulative frequency.</div>
  <div class="fcard" data-formula="grouped-hist"><b>Grouped histogram</b><br>Touching bars; height = frequency (or cf for cumulative).<br>Cumulative polygon: through top-right corners of each bar.</div>
  <div class="fcard" data-formula="density-hist"><b>Probability-density histogram</b><br>Vertical axis = relative frequency ÷ bin width.<br><span class="sym">P(class) = bin width × density</span><br>Total area = <span class="sym">1</span>.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Exercise 13C, printed pp. 500–503."),
  "REV": formulaShell(`
  <div class="fcard" data-formula="relfreq"><b>rf</b><br><span class="sym">rf = f ÷ total</span> — estimates probability.</div>
  <div class="fcard" data-formula="cf"><b>cf / crf</b><br>Cumulative counts; last crf = 1.</div>
  <div class="fcard" data-formula="median"><b>Median</b><br>From sorted data or from the ogive at halfway.</div>
  <div class="fcard" data-formula="class-centre"><b>Grouped data</b><br>Class centres for polygons; area for density histograms.</div>
  `, "CambridgeMATHS NSW Advanced Year 11, Chapter Review Exercise, printed pp. 504–506.")
};
let slides = [];
function pack(key) {
  LESSONS[key] = slides;
  slides = [];
}
function leftover(dev, chal, extra) {
  return `
    <div class="cite">Independent work — question numbers only</div>
    <p>Do these from the book. Do not copy extra question text here.</p>
    <div class="box"><b>Development:</b> ${dev}</div>
    <div class="box"><b>Challenge:</b> ${chal}</div>
    ${extra || ""}
    <div class="say">If you get stuck, the gold Formula List card is the method for that type.</div>`;
}

/* ========== 13A ========== */
let dataSeq = 0;

function freqTable(cols, rows) {
  const th = cols.map((c) => `<th>${c}</th>`).join("");
  const tr = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<table class="mini"><tr>${th}</tr>${tr}</table>`;
}

function histBars(o) {
  const xs = o.xs;
  const vals = o.vals;
  const ymax = o.ymax || Math.max(...vals, 0.01) * 1.15;
  const W = o.width || 560;
  const H = o.height || 300;
  const pl = 56, pr = 24, pt = 44, pb = 52;
  const pw = W - pl - pr, ph = H - pt - pb;
  const n = xs.length;
  const step = pw / n;
  const bw = step * 0.72;
  const toY = (v) => pt + ph - (v / ymax) * ph;
  const toX = (i) => pl + step * i + step / 2;
  const baseY = pt + ph;
  let bars = "";
  xs.forEach((x, i) => {
    const cx = toX(i);
    const h = (vals[i] / ymax) * ph;
    bars += `<rect x="${cx - bw / 2}" y="${baseY - h}" width="${bw}" height="${h}" fill="#1e6b66" opacity="0.88"/>`;
    bars += `<text x="${cx}" y="${baseY + 18}" text-anchor="middle" font-size="13" font-weight="700">${x}</text>`;
  });
  let yticks = "";
  const ySteps = o.yticks || 5;
  for (let t = 0; t <= ySteps; t++) {
    const v = (ymax / ySteps) * t;
    const y = toY(v);
    yticks += `<line x1="${pl}" y1="${y}" x2="${pl + pw}" y2="${y}" stroke="#d9cfc0" stroke-width="1"/>`;
    yticks += `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="11">${o.fmtY ? o.fmtY(v) : (Math.round(v * 100) / 100)}</text>`;
  }
  const title = o.title ? `<text x="${W / 2}" y="22" text-anchor="middle" font-size="15" font-weight="800">${o.title}</text>` : "";
  const xlab = o.xlabel ? `<text x="${W / 2}" y="${H - 8}" text-anchor="middle" font-size="13" font-weight="700">${o.xlabel}</text>` : "";
  const ylab = o.ylabel ? `<text x="14" y="${pt + ph / 2}" text-anchor="middle" font-size="13" font-weight="700" transform="rotate(-90 14 ${pt + ph / 2})">${o.ylabel}</text>` : "";
  return `<svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || "histogram"}">
    <rect x="8" y="8" width="${W - 16}" height="${H - 16}" fill="#fffdf8" stroke="#d9cfc0"/>
    ${title}${ylab}${xlab}${yticks}
    <line x1="${pl}" y1="${baseY}" x2="${pl + pw}" y2="${baseY}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${baseY}" stroke="#1c2333" stroke-width="2"/>
    ${bars}
  </svg>`;
}

function freqPolygon(o) {
  const xs = o.xs;
  const vals = o.vals;
  const ymax = o.ymax || Math.max(...vals, 0.01) * 1.15;
  const W = o.width || 560;
  const H = o.height || 300;
  const pl = 56, pr = 24, pt = 44, pb = 52;
  const pw = W - pl - pr, ph = H - pt - pb;
  const n = xs.length;
  const leftVal = o.polyLeft != null ? o.polyLeft : xs[0] - 1;
  const rightVal = o.polyRight != null ? o.polyRight : xs[n - 1] + 1;
  const xToPx = (x) => pl + ((x - leftVal) / (rightVal - leftVal)) * pw;
  const toY = (v) => pt + ph - (v / ymax) * ph;
  const baseY = pt + ph;
  const step = pw / n;
  const bw = step * 0.72;
  let bars = "";
  if (o.showBars !== false) {
    xs.forEach((x, i) => {
      const cx = pl + step * i + step / 2;
      const h = (vals[i] / ymax) * ph;
      bars += `<rect x="${cx - bw / 2}" y="${baseY - h}" width="${bw}" height="${h}" fill="#1e6b66" opacity="0.88"/>`;
      bars += `<text x="${cx}" y="${baseY + 18}" text-anchor="middle" font-size="13" font-weight="700">${x}</text>`;
    });
  } else {
    xs.forEach((x) => {
      bars += `<text x="${xToPx(x)}" y="${baseY + 18}" text-anchor="middle" font-size="12" font-weight="700">${x}</text>`;
    });
  }
  let yticks = "";
  const ySteps = o.yticks || 5;
  for (let t = 0; t <= ySteps; t++) {
    const v = (ymax / ySteps) * t;
    const y = toY(v);
    yticks += `<line x1="${pl}" y1="${y}" x2="${pl + pw}" y2="${y}" stroke="#d9cfc0" stroke-width="1"/>`;
    yticks += `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="11">${o.fmtY ? o.fmtY(v) : (Math.round(v * 100) / 100)}</text>`;
  }
  let polyPts = `${xToPx(leftVal)},${baseY}`;
  xs.forEach((x, i) => { polyPts += ` ${xToPx(x)},${toY(vals[i])}`; });
  polyPts += ` ${xToPx(rightVal)},${baseY}`;
  const title = o.title ? `<text x="${W / 2}" y="22" text-anchor="middle" font-size="15" font-weight="800">${o.title}</text>` : "";
  const xlab = o.xlabel ? `<text x="${W / 2}" y="${H - 8}" text-anchor="middle" font-size="13" font-weight="700">${o.xlabel}</text>` : "";
  const ylab = o.ylabel ? `<text x="14" y="${pt + ph / 2}" text-anchor="middle" font-size="13" font-weight="700" transform="rotate(-90 14 ${pt + ph / 2})">${o.ylabel}</text>` : "";
  return `<svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || "histogram and polygon"}">
    <rect x="8" y="8" width="${W - 16}" height="${H - 16}" fill="#fffdf8" stroke="#d9cfc0"/>
    ${title}${ylab}${xlab}${yticks}
    <line x1="${pl}" y1="${baseY}" x2="${pl + pw}" y2="${baseY}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${baseY}" stroke="#1c2333" stroke-width="2"/>
    ${bars}
    <polyline points="${polyPts}" fill="none" stroke="#a33b32" stroke-width="2.5"/>
  </svg>`;
}

function dotPlot(o) {
  const xs = o.xs;
  const counts = o.counts;
  const maxC = Math.max(...counts, 1);
  const r = 7;
  const colW = 54;
  const W = 48 + xs.length * colW;
  const H = 72 + maxC * (r * 2 + 6);
  const baseY = H - 36;
  let dots = "";
  xs.forEach((x, i) => {
    const cx = 36 + i * colW + colW / 2;
    for (let k = 0; k < counts[i]; k++) {
      const cy = baseY - 12 - k * (r * 2 + 4);
      dots += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1e6b66" stroke="#1c2333" stroke-width="1.5"/>`;
    }
    dots += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="14" font-weight="800">${x}</text>`;
  });
  const title = o.title ? `<text x="${W / 2}" y="22" text-anchor="middle" font-size="14" font-weight="800">${o.title}</text>` : "";
  const xlab = o.xlabel ? `<text x="${W / 2}" y="${H - 2}" text-anchor="middle" font-size="12" font-weight="700">${o.xlabel}</text>` : "";
  return `<svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || "dot plot"}">
    <rect x="6" y="6" width="${W - 12}" height="${H - 12}" fill="#fffdf8" stroke="#d9cfc0"/>
    ${title}${xlab}
    <line x1="24" y1="${baseY}" x2="${W - 16}" y2="${baseY}" stroke="#1c2333" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function scoopTree() {
  return freqTable(

/* ========== 13B ========== */
let cfSeq = 0;

/** Frequency / cumulative table (class mini). */
function cfTable(headers, rows, caption) {
  const head = headers.map((h) => `<th>${h}</th>`).join("");
  const body = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<table class="mini">${caption ? `<caption style="caption-side:top;text-align:left;font-weight:700;margin-bottom:6px">${caption}</caption>` : ""}<tr>${head}</tr>${body}</table>`;
}

/**
 * Cumulative histogram (bars touch; centred on xs).
 * o: { xs, ys, yLabel, title, rel, yMax, medianAt }
 */
function cumHist(o = {}) {
  ++cfSeq;
  const xs = o.xs || [];
  const ys = o.ys || [];
  const rel = !!o.rel;
  const yMax = o.yMax != null ? o.yMax : (rel ? 1 : Math.max(...ys, 1));
  const ox = 56, oy = 220, gw = 300, gh = 170;
  const xmin = xs.length ? Math.min(...xs) : 0;
  const xmax = xs.length ? Math.max(...xs) : 1;
  const xScale = (x) => ox + ((x - xmin) / (xmax - xmin || 1)) * gw;
  const yScale = (y) => oy - (y / yMax) * gh;
  const bw = gw / (xs.length || 1) * 0.82;
  let bars = "";
  xs.forEach((x, i) => {
    const h = ys[i];
    const cx = xScale(x);
    const y0 = yScale(0);
    const y1 = yScale(h);
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${(y0 - y1).toFixed(1)}" fill="#7eb6e8" stroke="#1c2333" stroke-width="1.2"/>`;
    bars += `<text x="${cx.toFixed(1)}" y="${oy + 16}" text-anchor="middle" font-size="11" font-weight="700">${x}</text>`;
  });
  let med = "";
  if (o.medianAt != null) {
    const my = rel ? 0.5 : o.medianAt.n / 2;
    const yM = yScale(my);
    med += `<line x1="${ox}" y1="${yM.toFixed(1)}" x2="${(ox + gw).toFixed(1)}" y2="${yM.toFixed(1)}" stroke="#a33b32" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    med += `<text x="${(ox + gw + 4).toFixed(1)}" y="${(yM + 4).toFixed(1)}" font-size="10" fill="#a33b32">${rel ? "crf = 0.5" : "halfway"}</text>`;
    if (o.medianAt.x != null) {
      med += `<line x1="${xScale(o.medianAt.x).toFixed(1)}" y1="${yM.toFixed(1)}" x2="${xScale(o.medianAt.x).toFixed(1)}" y2="${oy}" stroke="#1e6b66" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      med += `<text x="${xScale(o.medianAt.x).toFixed(1)}" y="${(oy + 32).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#1e6b66">median ≈ ${o.medianAt.label || o.medianAt.x}</text>`;
    }
  }
  const yTicks = rel ? [0, 0.2, 0.4, 0.6, 0.8, 1] : [];
  let yLab = "";
  if (rel) {
    yTicks.forEach((t) => {
      yLab += `<text x="${ox - 6}" y="${(yScale(t) + 4).toFixed(1)}" text-anchor="end" font-size="10">${t}</text>`;
    });
  }
  return `<svg class="tree" viewBox="0 0 400 280" role="img" aria-label="${o.title || "Cumulative histogram"}">
    <rect x="8" y="8" width="384" height="264" fill="#fffdf8" stroke="#d9cfc0"/>
    ${o.title ? `<text x="200" y="26" text-anchor="middle" font-size="13" font-weight="800">${o.title}</text>` : ""}
    <line x1="${ox}" y1="${oy}" x2="${ox + gw}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox}" y1="${oy - gh}" x2="${ox}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <text x="${(ox + gw / 2).toFixed(1)}" y="272" text-anchor="middle" font-size="12" font-weight="700">${o.xLabel || "score"}</text>
    <text x="18" y="120" text-anchor="middle" font-size="12" font-weight="700" transform="rotate(-90 18 120)">${o.yLabel || (rel ? "cumulative relative frequency" : "cumulative frequency")}</text>
    ${yLab}${bars}${med}
  </svg>`;
}

/**
 * Cumulative polygon (ogive): joins top-right corners; drops to axis at first bar.
 * o: { xs, ys, rel, title, xLabel, yLabel, medianAt }
 */
function ogivePolygon(o = {}) {
  ++cfSeq;
  const xs = o.xs || [];
  const ys = o.ys || [];
  const rel = !!o.rel;
  const yMax = o.yMax != null ? o.yMax : (rel ? 1 : Math.max(...ys, 1));
  const ox = 56, oy = 220, gw = 300, gh = 170;
  const xmin = xs.length ? Math.min(...xs) : 0;
  const xmax = xs.length ? Math.max(...xs) : 1;
  const xScale = (x) => ox + ((x - xmin) / (xmax - xmin || 1)) * gw;
  const yScale = (y) => oy - (y / yMax) * gh;
  const bw = gw / (xs.length || 1) * 0.82;
  let bars = "", pts = [];
  xs.forEach((x, i) => {
    const h = ys[i];
    const cx = xScale(x);
    const tr = cx + bw / 2;
    const y0 = yScale(0);
    const y1 = yScale(h);
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${(y0 - y1).toFixed(1)}" fill="#d7dde6" stroke="#1c2333" stroke-width="1"/>`;
    pts.push([tr, y1]);
    bars += `<text x="${cx.toFixed(1)}" y="${oy + 16}" text-anchor="middle" font-size="11" font-weight="700">${x}</text>`;
  });
  let poly = "";
  if (pts.length) {
    const x0 = xScale(xs[0]) - bw / 2;
    const path = [`M ${x0.toFixed(1)} ${oy.toFixed(1)}`]
      .concat(pts.map((p) => `L ${p[0].toFixed(1)} ${p[1].toFixed(1)}`))
      .join(" ");
    poly = `<path d="${path}" fill="none" stroke="#1e6b66" stroke-width="2.5"/>`;
  }
  let med = "";
  if (o.medianAt != null) {
    const my = rel ? 0.5 : o.medianAt.n / 2;
    const yM = yScale(my);
    med += `<line x1="${ox}" y1="${yM.toFixed(1)}" x2="${(ox + gw).toFixed(1)}" y2="${yM.toFixed(1)}" stroke="#a33b32" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    if (o.medianAt.x != null) {
      med += `<circle cx="${xScale(o.medianAt.x).toFixed(1)}" cy="${yM.toFixed(1)}" r="5" fill="#c9a227" stroke="#1c2333"/>`;
      med += `<text x="${xScale(o.medianAt.x).toFixed(1)}" y="${(oy + 32).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#1e6b66">median ≈ ${o.medianAt.label || o.medianAt.x}</text>`;
    }
  }
  return `<svg class="tree" viewBox="0 0 400 280" role="img" aria-label="${o.title || "Cumulative polygon (ogive)"}">
    <rect x="8" y="8" width="384" height="264" fill="#fffdf8" stroke="#d9cfc0"/>
    ${o.title ? `<text x="200" y="26" text-anchor="middle" font-size="13" font-weight="800">${o.title}</text>` : ""}
    <line x1="${ox}" y1="${oy}" x2="${ox + gw}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox}" y1="${oy - gh}" x2="${ox}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <text x="${(ox + gw / 2).toFixed(1)}" y="272" text-anchor="middle" font-size="12" font-weight="700">${o.xLabel || "score"}</text>
    <text x="18" y="120" text-anchor="middle" font-size="12" font-weight="700" transform="rotate(-90 18 120)">${o.yLabel || (rel ? "cumulative relative frequency" : "cumulative frequency")}</text>
    ${bars}${poly}${med}
  </svg>`;
}

/** Dot plot for discrete counts (Q10 cupcakes). */
function dotPlot(counts, xMin, xMax) {
  const ox = 50, oy = 200, gap = 32;
  let dots = "", labels = "";
  for (let x = xMin; x <= xMax; x++) {
    const n = counts[x - xMin] || 0;
    const cx = ox + (x - xMin) * gap;
    labels += `<text x="${cx}" y="${oy + 18}" text-anchor="middle" font-size="12" font-weight="700">${x}</text>`;
    for (let k = 0; k < n; k++) {
      dots += `<circle cx="${cx}" cy="${(oy - 12 - k * 14).toFixed(1)}" r="5" fill="#7eb6e8" stroke="#1c2333"/>`;
    }
  }
  return `<svg class="tree" viewBox="0 0 380 230" role="img" aria-label="Dot plot">
    <line x1="${ox - 10}" y1="${oy}" x2="${ox + (xMax - xMin) * gap + 10}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <text x="${(ox + (xMax - xMin) * gap / 2).toFixed(1)}" y="222" text-anchor="middle" font-size="12" font-weight="700">cupcakes per customer</text>
    ${labels}${dots}
  </svg>`;
}

/** Grouped frequency histogram + optional polygon through class centres. */
function groupedFreqHist(o = {}) {
  const centres = o.centres || [];
  const freqs = o.freqs || [];
  const n = centres.length;
  const yMax = o.yMax || Math.max(...freqs, 1) * 1.2;
  const barW = o.barW || 34;
  const ox = 58, oy = 228, gap = o.gap || 44;
  const yScale = 170 / yMax;
  let bars = "", polyPts = "";
  centres.forEach((c, i) => {
    const x = ox + i * gap;
    const h = freqs[i] * yScale;
    bars += `<rect x="${x - barW / 2}" y="${oy - h}" width="${barW}" height="${h}" fill="#7eb6e8" stroke="#1c2333" stroke-width="1.2"/>`;
    bars += `<text x="${x}" y="${oy + 18}" text-anchor="middle" font-size="11" font-weight="700">${c}</text>`;
    if (o.polygon !== false) {
      polyPts += `${x},${oy - h} `;
    }
  });
  const poly = o.polygon !== false
    ? `<polyline points="${polyPts.trim()}" fill="none" stroke="#a33b32" stroke-width="2.5"/>` +
      centres.map((c, i) => {
        const x = ox + i * gap, h = freqs[i] * yScale;
        return `<circle cx="${x}" cy="${oy - h}" r="4" fill="#a33b32"/>`;
      }).join("")
    : "";
  const yTicks = [];
  const step = o.yStep || Math.ceil(yMax / 4);
  for (let v = 0; v <= yMax; v += step) {
    const y = oy - v * yScale;
    yTicks.push(`<line x1="${ox - 6}" y1="${y}" x2="${ox + (n - 1) * gap + 10}" y2="${y}" stroke="#d9cfc0" stroke-width="0.6"/>`);
    yTicks.push(`<text x="${ox - 10}" y="${y + 4}" text-anchor="end" font-size="10" font-weight="700">${v}</text>`);
  }
  return `<svg class="dots" viewBox="0 0 520 280" role="img" aria-label="${o.aria || "Grouped frequency histogram"}">
    <text x="260" y="16" text-anchor="middle" font-size="12" font-weight="800">${o.title || ""}</text>
    <line x1="${ox - 8}" y1="${oy}" x2="${ox + (n - 1) * gap + 14}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox - 8}" y1="${oy}" x2="${ox - 8}" y2="36" stroke="#1c2333" stroke-width="2"/>
    ${yTicks.join("")}
    ${bars}${poly}
    <text x="${ox + (n - 1) * gap / 2}" y="268" text-anchor="middle" font-size="12" font-weight="800">${o.xLabel || "class centre"}</text>
    <text x="14" y="130" text-anchor="middle" font-size="11" font-weight="800" transform="rotate(-90 14 130)">${o.yLabel || "frequency"}</text>
  </svg>`;
}

/** Cumulative frequency histogram (step bars) + polygon through top-right corners. */
function groupedCumHist(o = {}) {
  const centres = o.centres || [];
  const cf = o.cf || [];
  const n = centres.length;
  const yMax = o.yMax || Math.max(...cf, 1) * 1.05;
  const barW = o.barW || 34;
  const ox = 58, oy = 228, gap = o.gap || 44;
  const yScale = 170 / yMax;
  let bars = "", polyPts = `${ox - barW / 2},${oy} `;
  centres.forEach((c, i) => {
    const x = ox + i * gap;
    const h = cf[i] * yScale;
    bars += `<rect x="${x - barW / 2}" y="${oy - h}" width="${barW}" height="${h}" fill="#9ec96a" stroke="#1c2333" stroke-width="1.2"/>`;
    bars += `<text x="${x}" y="${oy + 18}" text-anchor="middle" font-size="11" font-weight="700">${c}</text>`;
    polyPts += `${x + barW / 2},${oy - h} `;
  });
  const medianY = o.medianLine != null ? oy - o.medianLine * yScale : null;
  const medLine = medianY != null
    ? `<line x1="${ox - 8}" y1="${medianY}" x2="${ox + (n - 1) * gap + 14}" y2="${medianY}" stroke="#a33b32" stroke-width="2" stroke-dasharray="6 4"/>
       <text x="${ox + (n - 1) * gap + 18}" y="${medianY + 4}" font-size="11" font-weight="800" fill="#a33b32">50% → median</text>`
    : "";
  const yTicks = [];
  const step = o.yStep || Math.ceil(yMax / 4);
  for (let v = 0; v <= yMax; v += step) {
    const y = oy - v * yScale;
    yTicks.push(`<line x1="${ox - 6}" y1="${y}" x2="${ox + (n - 1) * gap + 10}" y2="${y}" stroke="#d9cfc0" stroke-width="0.6"/>`);
    yTicks.push(`<text x="${ox - 10}" y="${y + 4}" text-anchor="end" font-size="10" font-weight="700">${v}</text>`);
  }
  return `<svg class="dots" viewBox="0 0 520 280" role="img" aria-label="${o.aria || "Cumulative frequency histogram"}">
    <text x="260" y="16" text-anchor="middle" font-size="12" font-weight="800">${o.title || ""}</text>
    <line x1="${ox - 8}" y1="${oy}" x2="${ox + (n - 1) * gap + 14}" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox - 8}" y1="${oy}" x2="${ox - 8}" y2="36" stroke="#1c2333" stroke-width="2"/>
    ${yTicks.join("")}
    ${bars}
    <polyline points="${polyPts.trim()}" fill="none" stroke="#a33b32" stroke-width="2.5"/>
    ${medLine}
    <text x="${ox + (n - 1) * gap / 2}" y="268" text-anchor="middle" font-size="12" font-weight="800">${o.xLabel || "class centre"}</text>
    <text x="14" y="130" text-anchor="middle" font-size="11" font-weight="800" transform="rotate(-90 14 130)">${o.yLabel || "cumulative frequency"}</text>
  </svg>`;
}

/** Probability-density histogram (Challenge Q7). bins: [{lo, w, d}, ...] */
function densityHist(o = {}) {
  const bins = o.bins || [];
  const yMax = o.yMax || 0.11;
  const ox = 48, oy = 220, xScale = 14;
  const yScale = 180 / yMax;
  let rects = "", polyPts = "";
  bins.forEach((b, i) => {
    const x = ox + b.lo * xScale;
    const w = b.w * xScale;
    const h = b.d * yScale;
    rects += `<rect x="${x}" y="${oy - h}" width="${w}" height="${h}" fill="#7eb6e8" stroke="#1c2333" stroke-width="1"/>`;
    if (o.polygon !== false) {
      const cx = x + w / 2;
      polyPts += `${cx},${oy - h} `;
    }
    if (i % 2 === 0) {
      rects += `<text x="${x}" y="${oy + 16}" font-size="9" font-weight="700">${b.lo}</text>`;
    }
  });
  const last = bins[bins.length - 1];
  rects += `<text x="${ox + (last.lo + last.w) * xScale}" y="${oy + 16}" font-size="9" font-weight="700">${last.lo + last.w}</text>`;
  const poly = o.polygon !== false
    ? `<polyline points="${polyPts.trim()}" fill="none" stroke="#a33b32" stroke-width="2"/>` : "";
  const yTicks = [0, 0.02, 0.04, 0.06, 0.08, 0.1].map((v) => {
    const y = oy - v * yScale;
    return `<line x1="${ox - 4}" y1="${y}" x2="470" y2="${y}" stroke="#d9cfc0" stroke-width="0.5"/>
      <text x="${ox - 8}" y="${y + 3}" text-anchor="end" font-size="9" font-weight="700">${v.toFixed(2)}</text>`;
  }).join("");
  const hi = o.highlight || [];
  const hiRects = hi.map((idx) => {
    const b = bins[idx];
    const x = ox + b.lo * xScale, w = b.w * xScale, h = b.d * yScale;
    return `<rect x="${x}" y="${oy - h}" width="${w}" height="${h}" fill="none" stroke="#c9a227" stroke-width="3"/>`;
  }).join("");
  return `<svg class="dots" viewBox="0 0 500 260" role="img" aria-label="${o.aria || "Probability density histogram"}">
    <text x="250" y="14" text-anchor="middle" font-size="12" font-weight="800">${o.title || "Package Delivery Time"}</text>
    <line x1="${ox}" y1="${oy}" x2="470" y2="${oy}" stroke="#1c2333" stroke-width="2"/>
    <line x1="${ox}" y1="${oy}" x2="${ox}" y2="30" stroke="#1c2333" stroke-width="2"/>
    ${yTicks}${rects}${hiRects}${poly}
    <text x="260" y="248" text-anchor="middle" font-size="11" font-weight="800">${o.xLabel || "days"}</text>
    <text x="12" y="120" text-anchor="middle" font-size="10" font-weight="800" transform="rotate(-90 12 120)">${o.yLabel || "probability density"}</text>
  </svg>`;
}

const deck = document.getElementById("deck");
const toc = document.getElementById("toc");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let currentKey = "13A";
let i = 0;
let all = [];

function syncFormulas(slideEl) {
  if (!slideEl) return;
  const used = (slideEl.getAttribute("data-used-formulas") || "")
    .split(",").map((s) => s.trim()).filter(Boolean);
  document.querySelectorAll("#formula-list [data-formula]").forEach((card) => {
    card.classList.toggle("formula-used", used.includes(card.getAttribute("data-formula")));
  });
}
function go(n) {
  if (!all.length) return;
  i = Math.max(0, Math.min(all.length - 1, n));
  all.forEach((el, k) => el.classList.toggle("on", k === i));
  counter.textContent = (i + 1) + " / " + all.length;
  bar.style.width = ((i + 1) / all.length * 100) + "%";
  prev.disabled = i === 0;
  next.disabled = i === all.length - 1;
  syncFormulas(all[i]);
  document.querySelector("main").scrollTop = 0;
}
function loadLesson(key) {
  currentKey = key;
  if (location.hash.slice(1) !== key) location.hash = key;
  const meta = META[key];
  document.getElementById("hdr-title").textContent =
    "Year 11 Mathematics Advanced · " + meta.code + " " + meta.sub;
  document.getElementById("formula-list").innerHTML = FORMULAS[key];
  toc.querySelectorAll("button[data-key]").forEach((b) => {
    b.classList.toggle("on", b.dataset.key === key);
  });
  deck.innerHTML = "";
  (LESSONS[key] || []).forEach((s, idx) => {
    const el = document.createElement("section");
    el.className = "slide" + (idx === 0 ? " on" : "");
    el.setAttribute("data-used-formulas", s.used || "");
    el.innerHTML = `<p class="kicker">${s.kicker}</p><h2>${s.title}</h2>${s.html}`;
    deck.appendChild(el);
  });
  all = [...deck.querySelectorAll(".slide")];
  go(0);
}
ORDER.forEach((key) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.key = key;
  b.innerHTML = `<span class="code">${META[key].code}</span><span class="sub">${META[key].sub}</span>`;
  b.onclick = () => loadLesson(key);
  toc.appendChild(b);
});
prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(all.length - 1);
  if (e.key === "f" || e.key === "F") {
    const r = document.getElementById("formula-list");
    r.style.display = r.style.display === "none" ? "" : "none";
  }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.reveal");
  if (!b) return;
  const panel = document.getElementById(b.dataset.w);
  if (!panel) return;
  panel.classList.toggle("show");
  b.textContent = panel.classList.contains("show") ? "Hide working" : "Show working";
});
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (ORDER.includes(k) && k !== currentKey) loadLesson(k);
});
loadLesson((ORDER.includes((location.hash || "").slice(1)) ? location.hash.slice(1) : "13A"));

</script>
</body>
